<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書類承認状況 報告フォーム</title>
    <script src="https://static.worksmobile.net/static/wm/woff/edge/3.0/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f5f7; }
        .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .title { font-weight: bold; border-left: 4px solid #00c73c; padding-left: 8px; margin-bottom: 8px; }
        .checkbox-label { display: inline-block; margin: 4px; padding: 6px 12px; background: #eee; border-radius: 16px; font-size: 13px; }
        .btn { width: 100%; padding: 12px; background: #00c73c; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        #error-log { color: red; background: #ffebee; padding: 10px; border-radius: 4px; display: none; margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>📄 書類承認状況 報告</h2>
    <div id="loading">組織情報を読み込み中...</div>
    <div id="error-log"></div>

    <div id="form-area" style="display: none;">
        <div class="card">
            <div class="title">チーム情報</div>
            <p>対象チーム: <strong id="team-name">-</strong></p>
            <p>報告者: <strong id="reporter-name">-</strong></p>
        </div>

        <div class="card">
            <div class="title">対象メンバー選択</div>
            <div id="member-list"></div>
        </div>

        <button class="btn" onclick="sendReport()">報告メッセージを送信</button>
    </div>

    <script>
        const WOFF_ID = '8cQPHvc-oYIgzb4RUMaLdA';
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbz1R1PJHHWelNhuu5-6eil1-kzcvFfezfDunHF8nfI0B_lW3TSgfhF6YAxihMOiusZp/exec'; // ご自身のGASデプロイURL

        window.onload = async () => {
            const errorLog = document.getElementById('error-log');
            try {
                // 1. WOFF 初期化
                await woff.init({ woffId: WOFF_ID });

                // 2. ログインチェック
                if (!woff.isLoggedIn()) {
                    woff.login();
                    return;
                }

                // 3. ユーザープロファイル取得
                const profile = await woff.getProfile();
                document.getElementById('reporter-name').innerText = profile.displayName || profile.userId;

                // 4. GAS経由で組織・メンバー取得
                const res = await fetch(`${GAS_API_URL}?userId=${profile.userId}`);
                const data = await res.json();

                if (data.error) {
                    throw new Error('GASエラー: ' + data.error);
                }

                document.getElementById('team-name').innerText = data.teamName;

                // メンバーリスト作成
                const memberContainer = document.getElementById('member-list');
                memberContainer.innerHTML = '';
                (data.members || []).forEach((member, index) => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-label';
                    label.innerHTML = `<input type="checkbox" value="${member}"> ${member}`;
                    memberContainer.appendChild(label);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-area').style.display = 'block';

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                errorLog.style.display = 'block';
                errorLog.innerText = 'エラーが発生しました:\n' + err.message;
            }
        };

        async function sendReport() {
            const checkedBoxes = document.querySelectorAll('#member-list input[type="checkbox"]:checked');
            const selectedMembers = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedMembers.length === 0) {
                alert('メンバーを1人以上選択してください。');
                return;
            }

            const teamName = document.getElementById('team-name').innerText;
            const reporter = document.getElementById('reporter-name').innerText;

            const text = `【書類承認状況 報告】\n対象チーム: ${teamName}\n報告者: ${reporter}\n\n■ 承認完了メンバー\n・${selectedMembers.join('\n・')}`;

            try {
                await woff.sendCustomMessage({
                    message: { type: 'text', text: text }
                });
                woff.closeWindow();
            } catch (err) {
                alert('メッセージ送信エラー: ' + err.message);
            }
        }
    </script>
</body>
</html>
